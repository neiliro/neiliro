# Deploys to a VPS on a push to master.
#
# The image is built on the GitHub runner and shipped ready-made
# (docker save → ssh → docker load): a 1 GB server cannot handle a Vite
# build — it used to drown in swap until SSH dropped. The server only
# loads the image and restarts the compose stack.
#
# This workflow deploys to THIS repository owner's own server. It is a
# no-op unless the repository variable DEPLOY_ENABLED equals 'true'
# (Settings → Secrets and variables → Actions → Variables), so forks
# never attempt to deploy anywhere. Also required: secrets DEPLOY_HOST
# (server address), DEPLOY_SSH_KEY (private key) and DEPLOY_USER (the
# unprivileged sudo user from the guide; falls back to root when unset).
# Setup: docs/deploy-vps.md, "Auto-deploy from GitHub".

name: deploy

on:
  push:
    branches: [master]
  # A "Run workflow" button for manual deploys
  workflow_dispatch:

# Two pushes in a row do not race on the server: the second waits
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      DEPLOY: ${{ secrets.DEPLOY_USER || 'root' }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      # Deploying code that fails types or tests is pointless; ci.yml runs
      # the same checks in parallel, these gate the deploy itself.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build image
        run: docker build --build-arg BUILD_SHA=${{ github.sha }} -t family-hub:prod .

      - name: SSH key and server address
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship the image
        run: |
          docker save family-hub:prod | gzip | \
            ssh "$DEPLOY" 'gunzip | docker load'

      - name: Ship the code
        # --delete removes files on the server that were deleted from the
        # repository. Excluded paths (.env) are protected: --delete skips them.
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'certs' \
            --exclude 'web/dist' \
            --exclude 'server/dist' \
            ./ "$DEPLOY:/srv/family-hub/app/"

      - name: Restart
        # No --build: the freshly loaded image is already on the server.
        # The demo overlay joins in when the server's .env opts into it
        # (DEMO_DOMAIN set): the demo shares the image, so it has to be
        # recreated on deploy too — otherwise it would keep running the
        # previous image forever.
        #
        # The hub itself can be opted out the same way (HUB_ENABLED=false):
        # a machine that keeps the public demo after its hub has moved
        # elsewhere must not have the hub restarted under it on every push.
        run: |
          ssh "$DEPLOY" '
            cd /srv/family-hub/app
            files="-f docker-compose.prod.yml"
            services="caddy"
            grep -q "^HUB_ENABLED=false" .env 2>/dev/null || services="$services app"
            if grep -q "^DEMO_DOMAIN=" .env 2>/dev/null; then
              files="$files -f docker-compose.demo.yml"
              services="$services app-demo"
            fi
            docker compose $files up -d $services
          '

      - name: Health check
        # Relies on the container's own HEALTHCHECK (GET /api/health),
        # so no public hostname needs to live in this file. On a machine
        # that only carries the demo, the demo is what has to come up.
        run: |
          container=family-hub
          if ssh "$DEPLOY" 'grep -q "^HUB_ENABLED=false" /srv/family-hub/app/.env'; then
            container=family-hub-demo
          fi
          for i in $(seq 1 18); do
            status=$(ssh "$DEPLOY" \
              "docker inspect --format '{{.State.Health.Status}}' $container" 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              echo "ok"; exit 0
            fi
            sleep 5
          done
          echo "hub did not become healthy after the deploy" >&2
          exit 1
