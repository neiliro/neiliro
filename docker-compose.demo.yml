# Demo overlay — a public sandbox next to the production hub,
# on the same VPS and behind the same Caddy.
#
# Launch together with production:
#   docker compose -f docker-compose.prod.yml -f docker-compose.demo.yml up -d
#
# Requirements:
#   - DEMO_DOMAIN in .env (e.g. demo.example.com) with a DNS A record
#   - a demo site block in Caddyfile.prod (see docs/deploy-vps.md, "Public demo")
#
# Every visitor gets a private throwaway copy of a seeded sample family;
# idle sandboxes are dropped and the template is rebuilt daily by the app
# itself — no reset cron needed. Passwords, membership and file uploads
# stay blocked (see docs/deploy-vps.md, "Public demo").

# YAML anchors do not cross files, so the log cap is repeated here
# (see docker-compose.prod.yml for the reasoning).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app-demo:
    image: family-hub:prod
    build: .
    container_name: family-hub-demo
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SECURE_COOKIES: "true"
      TRUST_PROXY: "true"
      DEMO_MODE: "true"
    volumes:
      - ${DEMO_DATA_DIR:-/srv/family-hub/demo-data}:/data
    # Every guest holds an open SQLite database — three descriptors each
    # (db, -wal, -shm) — and the demo keeps up to 300 of them alive
    # (lib/sandbox.ts). Docker's default 1024 would be reached by a busy
    # afternoon, and running out of descriptors takes down the process
    # rather than one sandbox.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    expose:
      - "8787"
